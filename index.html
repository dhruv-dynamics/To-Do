<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple & Clean To-Do App</title>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="todo-app">
    <!-- Header -->
    <header class="app-header">
      <h2>My Tasks 📝</h2>
      <p id="stats-text">0 completed of 0 tasks</p>
    </header>

    <!-- Task Input Form -->
    <form id="task-form">
      <input 
        type="text" 
        id="task-input" 
        placeholder="Add a new task..." 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Task List -->
    <ul id="task-list">
      <!-- Tasks dynamically yahan JS se add honge -->
    </ul>

    <!-- Footer Controls -->
    <div class="app-footer">
      <span id="items-left">0 tasks pending</span>
      <button id="clear-completed-btn">Clear Completed</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
